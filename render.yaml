# VANTEGE WEAR — Telegram Bot (Render deploy)
# Render Dashboard: New + -> Blueprint -> shu repo tanlang

services:
  - type: worker
    name: vantegewear-bot
    runtime: python
    plan: free
    rootDir: bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: TELEGRAM_BOT_TOKEN
        sync: false      # Render Dashboard'da qo'lda kiriting
      - key: WEBAPP_URL
        value: "https://night-26.vercel.app"
      - key: ADMIN_CHAT_ID
        sync: false      # o'z chat ID'ingizni kiriting (masalan 123456789)
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8080"
